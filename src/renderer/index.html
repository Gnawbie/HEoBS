<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self'">
  <title>HEoBS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" class="icon" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>

    <div id="toolbar">
      <button id="back" class="icon" title="Back (Alt+Left)">
        <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button id="forward" class="icon" title="Forward (Alt+Right)">
        <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
      </button>
      <button id="reload" class="icon" title="Reload (Ctrl+R)">
        <svg class="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
        <svg class="i-stop" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>

      <form id="omnibox">
        <span id="security"></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or enter address">
        <button id="star" class="icon" type="button" title="Bookmark this page (Ctrl+D)">
          <svg viewBox="0 0 16 16"><path d="m8 2 1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.4l-3.7 2.1.8-4.2L2 6.4l4.2-.5z"/></svg>
        </button>
      </form>

      <button id="download" type="button" hidden></button>
      <button id="shield" type="button" title="Tracker protection">
        <svg viewBox="0 0 16 16"><path d="M8 1.8 13 3.6v4c0 3.1-2.1 5.4-5 6.6-2.9-1.2-5-3.5-5-6.6v-4z"/></svg>
        <span id="shieldcount"></span>
      </button>
      <button id="key" class="icon" title="Passwords">
        <svg viewBox="0 0 16 16"><circle cx="5.2" cy="10.8" r="2.7"/><path d="m7.2 8.8 6-6M11 5l1.8 1.8M9.2 6.8l1.4 1.4"/></svg>
      </button>
      <button id="menu" class="icon" title="Menu">
        <svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
      </button>
    </div>

    <div id="bookmarks" hidden></div>

    <div id="pwbar" hidden>
      <span id="pwtext"></span>
      <button id="pwsave" type="button" class="pill primary">Save</button>
      <button id="pwno" type="button" class="pill">Not now</button>
    </div>

    <div id="findbar" hidden>
      <input id="findtext" type="text" spellcheck="false" placeholder="Find in page">
      <span id="findcount"></span>
      <button id="findprev" class="icon" title="Previous (Shift+Enter)">
        <svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></svg>
      </button>
      <button id="findnext" class="icon" title="Next (Enter)">
        <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <button id="findclose" class="icon" title="Close (Esc)">
        <svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
