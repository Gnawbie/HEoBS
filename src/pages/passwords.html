<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Passwords</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="settings">
    <h1>Passwords</h1>
    <p class="muted">Saved logins are stored only on this PC, encrypted with AES-256-GCM. They are never uploaded.</p>

    <section id="locked" hidden>
      <h2>Locked</h2>
      <div id="unlock-hello" hidden>
        <p>Confirm it's you with your Windows PIN, fingerprint or face.</p>
        <button id="hello-btn" class="primary">Unlock with Windows Hello</button>
      </div>
      <form id="unlock-master" class="inline" hidden>
        <input id="master-input" type="password" placeholder="Master password" autocomplete="off">
        <button class="primary">Unlock</button>
      </form>
      <p id="unlock-msg" class="msg"></p>
    </section>

    <section id="unlocked" hidden>
      <div class="bar">
        <input id="filter" type="text" placeholder="Search saved logins" autocomplete="off" spellcheck="false">
        <button id="lock-btn" hidden>Lock now</button>
      </div>
      <div id="list"></div>

      <h2>Lock method</h2>
      <div id="modes" class="choices"></div>
      <form id="master-form" class="inline" hidden>
        <input id="new-master" type="password" placeholder="New master password (8+ characters)" autocomplete="off">
        <input id="new-master2" type="password" placeholder="Repeat it" autocomplete="off">
        <button class="primary">Set master password</button>
      </form>
      <p id="mode-msg" class="msg"></p>
      <p class="muted small">Importing passwords from another browser is under <a href="heobs://settings/#import">Settings → Import</a>.</p>
    </section>
  </main>
  <script src="passwords.js"></script>
</body>
</html>
