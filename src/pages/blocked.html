<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Dangerous site blocked</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body class="danger">
  <main class="error">
    <h1 id="title">Dangerous site blocked</h1>

    <p class="muted small">HEoBS checked this address against lists stored on this PC. Nothing about your visit was sent anywhere.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
